[workspace]
resolver = "2"
members = [
    "crates/fastpdf-core",
    "crates/fastpdf-wasm",
    "crates/fastpdf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/fastpdf"
rust-version = "1.75"

[workspace.dependencies]
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
log = "0.4"
hayro = { version = "0.7", features = ["embed-fonts"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
