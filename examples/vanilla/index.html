<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastPDF — Vanilla</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      #layout { display: flex; gap: 1rem; align-items: flex-start; }
      #thumbs {
        width: 110px;
        flex-shrink: 0;
        max-height: 80vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #thumbs button {
        border: 2px solid transparent;
        padding: 0;
        background: #eee;
        cursor: pointer;
      }
      #thumbs button.active { border-color: #1565c0; }
      #thumbs canvas { display: block; width: 100%; height: auto; }
      #sidebar { width: 200px; flex-shrink: 0; max-height: 80vh; overflow-y: auto; }
      #viewer { flex: 1; min-width: 0; overflow: auto; }
      #canvas {
        border: 1px solid #888;
        background: #f0f0f0;
        display: block;
      }
      .outline button { display: block; width: 100%; text-align: left; margin: 2px 0; }
      #status { margin: 0.5rem 0; color: #333; font-size: 0.9rem; }
      #error { color: #b00020; margin: 0.5rem 0; }
      .toolbar {
        margin: 0.5rem 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      .pager { display: flex; gap: 0.5rem; align-items: center; }
      label.zoom { display: flex; gap: 0.35rem; align-items: center; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>FastPDF</h1>
    <p>Engine: <code id="version"></code></p>
    <input type="file" id="file" accept="application/pdf" />
    <div class="toolbar" id="toolbar" hidden>
      <div class="pager" id="pager">
        <button type="button" id="prev">Previous</button>
        <span id="pageLabel"></span>
        <button type="button" id="next">Next</button>
      </div>
      <label class="zoom">
        Zoom
        <input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1.25" />
        <span id="zoomLabel">1.25×</span>
      </label>
    </div>
    <p id="status">Choose a PDF to render.</p>
    <p id="error" hidden></p>
    <div id="layout">
      <div id="thumbs" aria-label="Page thumbnails"></div>
      <div id="sidebar" aria-label="Outline"></div>
      <div id="viewer"><canvas id="canvas" width="1" height="1" aria-label="PDF page"></canvas></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
