<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastPDF — Vanilla</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      #layout { display: flex; gap: 1rem; align-items: flex-start; }
      #sidebar { width: 220px; flex-shrink: 0; }
      #viewer { flex: 1; min-width: 0; }
      canvas {
        border: 1px solid #888;
        background: #f0f0f0;
        max-width: 100%;
        display: block;
      }
      .outline button { display: block; width: 100%; text-align: left; margin: 2px 0; }
      #status { margin: 0.5rem 0; color: #333; font-size: 0.9rem; }
      #error { color: #b00020; margin: 0.5rem 0; }
      .pager { margin: 0.5rem 0; display: flex; gap: 0.5rem; align-items: center; }
    </style>
  </head>
  <body>
    <h1>FastPDF</h1>
    <p>Engine: <code id="version"></code></p>
    <input type="file" id="file" accept="application/pdf" />
    <div class="pager" id="pager" hidden>
      <button type="button" id="prev">Previous</button>
      <span id="pageLabel"></span>
      <button type="button" id="next">Next</button>
    </div>
    <p id="status">Choose a PDF to render.</p>
    <p id="error" hidden></p>
    <div id="layout">
      <div id="sidebar"></div>
      <div id="viewer"><canvas id="canvas" width="1" height="1" aria-label="PDF page"></canvas></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
